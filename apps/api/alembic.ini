[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Database URL comes from .env / app settings. The value below is only a
# fallback and is overridden in env.py.
sqlalchemy.url = postgresql+psycopg://expense_audit:expense_audit@localhost:5432/expense_audit

# [post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S